# 走 Cloudflare 代理时，$remote_addr 是 Cloudflare 节点 IP，真实客户端 IP 在 CF-Connecting-IP。
map $http_cf_connecting_ip $evc_real_ip {
    default $http_cf_connecting_ip;
    '' $remote_addr;
}

server {
    listen 80;
    listen [::]:80;
    server_name admin.token4u.cc;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name admin.token4u.cc;

    # 优先用 Cloudflare Origin CA 证书；没有时退回自签证书（Cloudflare Full 模式可用）。
    ssl_certificate     /etc/nginx/ssl/admin.token4u.cc.crt;
    ssl_certificate_key /etc/nginx/ssl/admin.token4u.cc.key;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:ADMINSSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 20m;

    location / {
        proxy_pass http://127.0.0.1:8780;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $evc_real_ip;
        proxy_set_header X-Forwarded-For $evc_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
}
